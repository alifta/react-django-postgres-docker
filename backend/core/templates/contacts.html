{% extends 'base.html' %}

{% block content %}
  <div>
    <h1 class="text-4xl text-success mb-4">Contact Manager</h1>

    <label class="input w-full flex items-center gap-2 mb-2">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </g>
      </svg>
      <input type="search" class="grow" placeholder="Search" name="search" hx-get="{% url 'contacts-search' %}" hx-trigger="keyup delay:500ms" hx-target="#contacts-list" hx-indicator="#contacts-indicator" hx-on::before-request="document.getElementById('contacts-list').style.opacity = 0.4;" hx-on::after-request="document.getElementById('contacts-list').style.opacity = 1.0;" />
      {% include 'partials/contacts-spinner.html' %}
    </label>

    {% include 'partials/contacts-list.html' %}
  </div>
{% endblock %}
